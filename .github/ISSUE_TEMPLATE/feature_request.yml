name: "🚀 Feature Request"
description: Suggest an idea for VocalGuard
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ### 💡 Got a great idea? 
        We're always looking to improve VocalGuard. Please describe your suggestion in detail.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: "e.g., I'm always frustrated when [...]"
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
  - type: checkmarks
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched the existing issues for similar suggestions
          required: true
        - label: This is a single, focused feature request (not a list of many small items)
          required: true
