# =============================================================================
# VocalGuard — Deploy to Production
# =============================================================================
# Triggers:
#   - Automatic: successful CI on main branch
#   - Manual:    workflow_dispatch with environment selector
#
# Architecture:
#   Backend  → Google Cloud Run  (container, auto-scaling 0-10)
#   Frontend → Firebase Hosting  (CDN, global edge caching)
#
# Rollback strategy:
#   - Cloud Run keeps last 5 revisions; rollback via:
#       gcloud run services update-traffic vocalguard-api \
#         --to-revisions=<REVISION>=100
#   - Firebase Hosting keeps last 20 releases; rollback via:
#       firebase hosting:clone <CHANNEL> live
#
# Required secrets:
#   GCP_PROJECT_ID         — Google Cloud project ID
#   GCP_SA_KEY             — Service account JSON key (base64-encoded)
#   GCP_REGION             — Deployment region (e.g., asia-south1)
#   FIREBASE_TOKEN         — Firebase CLI deploy token
#   FIREBASE_WEB_API_KEY   — Runtime config for the backend
# =============================================================================

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false        # never cancel an in-progress deploy

env:
  GCP_REGION: ${{ secrets.GCP_REGION || 'asia-south1' }}
  SERVICE_NAME: vocalguard-api
  DOCKER_IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/vocalguard-api

jobs:
  # =========================================================================
  # Gate — only deploy if CI passed
  # =========================================================================
  gate:
    name: "Deploy Gate"
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "✅ Deploy gate passed"

  # =========================================================================
  # Backend → Google Cloud Run
  # =========================================================================
  deploy-backend:
    name: "Deploy Backend"
    runs-on: ubuntu-latest
    needs: gate
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build container image
        run: |
          docker build \
            --tag "${{ env.DOCKER_IMAGE }}:${{ github.sha }}" \
            --tag "${{ env.DOCKER_IMAGE }}:latest" \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg GIT_SHA=${{ github.sha }} \
            --file backend/Dockerfile \
            backend/

      - name: Push container image
        run: |
          docker push "${{ env.DOCKER_IMAGE }}:${{ github.sha }}"
          docker push "${{ env.DOCKER_IMAGE }}:latest"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --min-instances=0
            --max-instances=10
            --memory=2Gi
            --cpu=2
            --timeout=300
            --concurrency=80
            --set-env-vars=FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }}

      - name: Smoke test backend
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "🔍 Testing $URL/health"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health" --max-time 30)
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed (HTTP $STATUS)"
            exit 1
          fi
          echo "✅ Backend health check passed"

  # =========================================================================
  # Frontend → Firebase Hosting
  # =========================================================================
  deploy-frontend:
    name: "Deploy Frontend"
    runs-on: ubuntu-latest
    needs: gate
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build for production
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          channelId: live
          projectId: ${{ secrets.GCP_PROJECT_ID }}
          entryPoint: frontend

  # =========================================================================
  # Post-deploy notification
  # =========================================================================
  notify:
    name: "Notify"
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    steps:
      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend   | ${{ needs.deploy-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend  | ${{ needs.deploy-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
